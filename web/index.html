<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Books 笔记</title>
  <style>
    :root {
      --bg: #f4efe6;
      --bg-2: #fffaf2;
      --ink: #1f1a14;
      --muted: #6d6458;
      --line: #e4d8c6;
      --quote: #3f6f8a;
      --note: #2d5a45;
      --note-bg: #eef6f1;
      --quote-bg: #f7f1e6;
      --accent: #b4532a;
      --chip: #efe4d4;
      --shadow: 0 1px 2px rgba(40, 24, 8, .06);
      --sidebar: 300px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161311;
        --bg-2: #1e1a16;
        --ink: #f3ece3;
        --muted: #b3a89a;
        --line: #3a3229;
        --quote: #8fcae0;
        --note: #9dd4b5;
        --note-bg: #24332b;
        --quote-bg: #2a241c;
        --accent: #e08b5a;
        --chip: #2c261f;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 16px/1.65 ui-sans-serif, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app { display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100%; }
    aside {
      border-right: 1px solid var(--line);
      background: var(--bg-2);
      overflow: auto;
      padding: 20px 14px 32px;
    }
    h1 { font-size: 15px; margin: 0 0 14px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    .book, .chapter, .section {
      width: 100%; text-align: left; border: 0; background: transparent;
      color: inherit; cursor: pointer; border-radius: 10px; padding: 8px 10px;
    }
    .book:hover, .chapter:hover, .section:hover { background: var(--chip); }
    .book.active, .chapter.active, .section.active { background: var(--chip); }
    .book .t { font-weight: 650; font-size: 14px; }
    .book .m, .chapter .m { color: var(--muted); font-size: 12px; }
    .chapter { padding-left: 10px; margin-top: 8px; }
    .chapter .t { font-size: 13px; font-weight: 650; }
    .section { padding: 5px 10px 5px 22px; margin-top: 1px; }
    .section .t { font-size: 12.5px; color: var(--muted); font-weight: 500; }
    .section.active .t { color: var(--ink); font-weight: 650; }
    .toc {
      width: 100%; text-align: left; border: 0; background: transparent;
      color: inherit; cursor: pointer; border-radius: 10px; padding: 5px 10px; margin-top: 1px;
    }
    .toc:hover, .toc.active { background: var(--chip); }
    .toc .t { font-size: 12.5px; }
    .toc.d0 { margin-top: 8px; padding-left: 10px; }
    .toc.d0 .t { font-size: 13px; font-weight: 650; }
    .toc.d1 { padding-left: 22px; }
    .toc.d2 { padding-left: 34px; color: var(--muted); }
    .toc.d3 { padding-left: 46px; color: var(--muted); font-size: 12px; }
    .toc.d4, .toc.d5 { padding-left: 58px; color: var(--muted); font-size: 12px; }
    .toc.active .t { color: var(--ink); font-weight: 650; }
    .page-title { font-size: 18px; font-weight: 650; margin: 0 0 18px; max-width: 820px; }
    main { overflow: auto; padding: 28px 8vw 80px; }
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      margin-bottom: 22px; position: sticky; top: 0; background: var(--bg);
      padding: 8px 0 14px; z-index: 2;
    }
    input[type="search"] {
      flex: 1; min-width: 180px; border: 1px solid var(--line); background: var(--bg-2);
      color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit;
    }
    button.chip {
      border: 1px solid var(--line); background: var(--bg-2); color: var(--ink);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
    }
    button.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .card {
      background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px 20px; margin: 0 0 16px; box-shadow: var(--shadow);
      max-width: 820px;
    }
    .card.s1 { border-left: 4px solid #67a16c; }
    .card.s2 { border-left: 4px solid #5b8fd4; }
    .card.s3 { border-left: 4px solid #d1a54a; }
    .card.s4 { border-left: 4px solid #d57aa2; }
    .card.s5 { border-left: 4px solid #8b7cc9; }
    .sec { font-size: 12px; color: var(--accent); font-weight: 650; margin-bottom: 8px; }
    .quote {
      white-space: pre-wrap; background: var(--quote-bg); color: var(--ink);
      padding: 12px 14px; border-radius: 10px; margin: 0 0 12px;
    }
    .note {
      white-space: pre-wrap; background: var(--note-bg); color: var(--ink);
      padding: 12px 14px; border-radius: 10px; margin: 0;
    }
    .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    .meta {
      margin-top: 10px; color: var(--muted); font-size: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .share-btn {
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 12px;
    }
    .share-btn:hover { background: var(--chip); }
    .meta-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .empty, .error { color: var(--muted); max-width: 640px; }
    .modal {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(20, 14, 8, .45); align-items: center; justify-content: center;
      padding: 24px;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: var(--bg-2); color: var(--ink); border-radius: 16px;
      padding: 18px; max-width: min(720px, 100%); max-height: 92vh;
      overflow: auto; box-shadow: 0 16px 40px rgba(20, 14, 8, .25);
    }
    .modal-card img { display: block; width: 100%; height: auto; border-radius: 10px; background: #fff; }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .modal-actions .chip { cursor: pointer; }
    .count { float: right; color: var(--muted); font-size: 12px; }
    .toast {
      position: fixed; right: 22px; bottom: 22px; z-index: 30;
      background: var(--ink); color: var(--bg); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      aside { height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="nav"></aside>
    <main>
      <div class="toolbar">
        <input id="q" type="search" placeholder="搜索原文或评论" />
        <button class="chip on" id="notesOnly" type="button">只看有评论</button>
        <button class="chip" id="refresh" type="button">刷新</button>
        <button class="chip" id="lang" type="button">EN</button>
      </div>
      <div id="content" class="empty">正在读取 Books 笔记库…</div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal" id="shareModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <img id="sharePreview" alt="" />
      <div class="modal-actions">
        <button class="chip on" id="copyImage" type="button">复制图片</button>
        <button class="chip" id="downloadImage" type="button">下载</button>
        <button class="chip" id="closeShare" type="button">关闭</button>
      </div>
    </div>
  </div>
  <script>
    const I18N = {
      zh: {
        title: "Books 笔记",
        books: "书籍",
        chapters: "章节",
        allChapters: "全部章节",
        meta: (n, h) => `${n} 评 / ${h} 划`,
        search: "搜索原文或评论",
        notesOnly: "只看有评论",
        refresh: "刷新",
        quote: "原文",
        note: "评论",
        loading: "正在读取 Books 笔记库…",
        emptyBook: "没有找到划线或评论。",
        emptySection: "这一节没有符合条件的条目。关掉「只看有评论」，或换一节。",
        loadError: (e) => `读库失败：${e}`,
        langBtn: "EN",
        share: "分享",
        copyText: "复制",
        copyQuote: "复制原文",
        copyImage: "复制图片",
        copied: "已复制",
        copyFailed: "复制失败，请改用下载",
        copyTextFailed: "复制失败",
        download: "下载",
        close: "关闭",
        shareAlt: "笔记分享图",
        synced: "已同步",
      },
      en: {
        title: "Books Notes",
        books: "Books",
        chapters: "Chapters",
        allChapters: "All chapters",
        meta: (n, h) => `${n} notes / ${h} highlights`,
        search: "Search quotes and notes",
        notesOnly: "Notes only",
        refresh: "Refresh",
        quote: "Quote",
        note: "Note",
        loading: "Reading the Apple Books library…",
        emptyBook: "No highlights or notes found.",
        emptySection: "Nothing in this section. Turn off Notes only, or pick another section.",
        loadError: (e) => `Could not read the library: ${e}`,
        langBtn: "中文",
        share: "Share",
        copyText: "Copy",
        copyQuote: "Copy quote",
        copyImage: "Copy image",
        copied: "Copied",
        copyFailed: "Copy failed. Download instead.",
        copyTextFailed: "Copy failed",
        download: "Download",
        close: "Close",
        shareAlt: "Shared note image",
        synced: "Updated",
      },
    };

    const savedLang = localStorage.getItem("books-notes-lang");
    const VIEW_KEY = "books-notes-view";
    const state = {
      data: null,
      bookId: null,
      path: [],
      notesOnly: true,
      q: "",
      lang: savedLang || (navigator.language.startsWith("zh") ? "zh" : "en"),
      shareBlob: null,
      shareUrl: "",
      _scroll: { main: 0, nav: 0 },
      rev: null,
      loading: false,
      pendingLoad: false,
    };

    const $ = (id) => document.getElementById(id);
    const t = (key, ...args) => {
      const value = I18N[state.lang][key];
      return typeof value === "function" ? value(...args) : value;
    };

    function applyChrome() {
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      document.title = t("title");
      $("q").placeholder = t("search");
      $("notesOnly").textContent = t("notesOnly");
      $("notesOnly").classList.toggle("on", state.notesOnly);
      $("q").value = state.q;
      $("refresh").textContent = t("refresh");
      $("lang").textContent = t("langBtn");
      $("copyImage").textContent = t("copyImage");
      $("downloadImage").textContent = t("download");
      $("closeShare").textContent = t("close");
      $("sharePreview").alt = t("shareAlt");
    }

    function fmt(iso) {
      if (!iso) return "";
      return iso.replace("T", " ").slice(0, 16);
    }

    function currentBook() {
      return (state.data?.books || []).find((b) => b.id === state.bookId) || state.data?.books?.[0];
    }

    function itemHeadings(item, chapterTitle) {
      if (item.headings && item.headings.length) return item.headings;
      return chapterTitle ? [chapterTitle] : [];
    }

    function pathEqual(a, b) {
      return Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((v, i) => v === b[i]);
    }

    function pathPrefix(headings, prefix) {
      return prefix.every((v, i) => headings[i] === v);
    }

    function flattenItems(book) {
      const out = [];
      for (const ch of book.chapters) {
        for (const item of ch.items) {
          out.push({ ...item, chapter: ch.title, headings: itemHeadings(item, ch.title) });
        }
      }
      return out;
    }

    function buildToc(book) {
      const root = { title: "", path: [], children: [], count: 0 };
      for (const item of flattenItems(book)) {
        if (state.notesOnly && !item.note) continue;
        let node = root;
        node.count += 1;
        const trail = [];
        for (const title of item.headings) {
          trail.push(title);
          let child = node.children.find((c) => c.title === title);
          if (!child) {
            child = { title, path: trail.slice(), children: [], count: 0 };
            node.children.push(child);
          }
          child.count += 1;
          node = child;
        }
      }
      return root;
    }

    function pathExists(root, path) {
      let node = root;
      for (const title of path) {
        node = node.children.find((c) => c.title === title);
        if (!node) return false;
      }
      return true;
    }

    function itemLocation(item) {
      if (item.headings && item.headings.length) return item.headings.join(" · ");
      return [item.chapter, item.section].filter(Boolean).join(" · ");
    }

    function saveView() {
      const main = document.querySelector("main");
      const aside = document.querySelector("aside");
      localStorage.setItem(VIEW_KEY, JSON.stringify({
        bookId: state.bookId,
        path: state.path,
        notesOnly: state.notesOnly,
        q: state.q,
        mainScroll: main ? main.scrollTop : 0,
        navScroll: aside ? aside.scrollTop : 0,
      }));
    }

    function restoreView(data) {
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(VIEW_KEY) || "{}");
      } catch {
        saved = {};
      }
      const books = data.books || [];
      const book = books.find((b) => b.id === saved.bookId) || books[0];
      state.bookId = book?.id || null;
      let path = Array.isArray(saved.path) ? saved.path.slice() : [];
      if (!path.length && book) {
        if (saved.section) {
          for (const item of flattenItems(book)) {
            const idx = item.headings.indexOf(saved.section);
            if (idx >= 0) {
              path = item.headings.slice(0, idx + 1);
              break;
            }
          }
        } else if (saved.chapterId) {
          const ch = book.chapters.find((c) => c.id === saved.chapterId);
          if (ch?.title) path = [ch.title];
        }
      }
      if (typeof saved.notesOnly === "boolean") state.notesOnly = saved.notesOnly;
      if (typeof saved.q === "string") state.q = saved.q;
      if (book && path.length && !pathExists(buildToc(book), path)) path = [];
      state.path = path;
      state._scroll = { main: saved.mainScroll || 0, nav: saved.navScroll || 0 };
    }

    function applyScroll() {
      const aside = document.querySelector("aside");
      const main = document.querySelector("main");
      if (aside) aside.scrollTop = state._scroll.nav || 0;
      if (main) main.scrollTop = state._scroll.main || 0;
    }

    function visibleItems(book) {
      const q = state.q.trim().toLowerCase();
      const out = [];
      for (const item of flattenItems(book)) {
        if (state.notesOnly && !item.note) continue;
        if (state.path.length && !pathPrefix(item.headings, state.path)) continue;
        const blob = `${item.quote}\n${item.note}\n${item.headings.join("\n")}`.toLowerCase();
        if (q && !blob.includes(q)) continue;
        out.push(item);
      }
      return out;
    }

    function pageTitle(book) {
      return state.path.length ? state.path.join(" · ") : t("allChapters");
    }

    function renderTocNodes(nodes, parts) {
      for (const node of nodes) {
        if (node.count === 0) continue;
        const depth = Math.min(node.path.length - 1, 5);
        const on = pathEqual(state.path, node.path) ? " active" : "";
        parts.push(`<button class="toc d${depth}${on}" data-path="${encodeURIComponent(JSON.stringify(node.path))}">
          <div class="t">${esc(node.title)} <span class="count">${node.count}</span></div>
        </button>`);
        renderTocNodes(node.children, parts);
      }
    }

    function renderNav(book) {
      const books = state.data.books;
      const parts = [`<h1>${t("books")}</h1>`];
      for (const b of books) {
        const on = b.id === book.id ? " active" : "";
        parts.push(`<button class="book${on}" data-book="${b.id}">
          <div class="t">${esc(b.title)}</div>
          <div class="m">${esc(b.author)} · ${t("meta", b.noteCount, b.highlightCount)}</div>
        </button>`);
      }
      const toc = buildToc(book);
      parts.push(`<h1 style='margin-top:18px'>${t("chapters")}</h1>`);
      parts.push(`<button class="chapter${state.path.length === 0 ? " active" : ""}" data-path="${encodeURIComponent("[]")}">
        <div class="t">${t("allChapters")} <span class="count">${toc.count}</span></div>
      </button>`);
      renderTocNodes(toc.children, parts);
      $("nav").innerHTML = parts.join("");
      $("nav").querySelectorAll("[data-book]").forEach((el) => {
        el.onclick = () => {
          state.bookId = el.dataset.book;
          state.path = [];
          state._scroll.main = 0;
          render();
        };
      });
      $("nav").querySelectorAll("[data-path]").forEach((el) => {
        el.onclick = () => {
          try {
            state.path = JSON.parse(decodeURIComponent(el.dataset.path || "[]"));
          } catch {
            state.path = [];
          }
          state._scroll.main = 0;
          render();
        };
      });
    }

    function renderMain(book) {
      const items = visibleItems(book);
      const title = `<h2 class="page-title">${esc(pageTitle(book))}</h2>`;
      if (!items.length) {
        $("content").innerHTML = `${title}<p class="empty">${t("emptySection")}</p>`;
        return;
      }
      $("content").innerHTML = title + items.map((item, idx) => `
        <article class="card s${item.style || 0}">
          <div class="sec">${esc((item.headings || []).join(" · "))}</div>
          ${item.quote ? `<div class="label">${t("quote")}</div><div class="quote">${esc(item.quote)}</div>` : ""}
          ${item.note ? `<div class="label">${t("note")}</div><div class="note">${esc(item.note)}</div>` : ""}
          <div class="meta">
            <span>${fmt(item.created)}</span>
            <div class="meta-actions">
              ${item.note && item.quote ? `<button class="share-btn" type="button" data-copy-quote="${idx}">${t("copyQuote")}</button>` : ""}
              <button class="share-btn" type="button" data-copy="${idx}">${t("copyText")}</button>
              <button class="share-btn" type="button" data-share="${idx}">${t("share")}</button>
            </div>
          </div>
        </article>
      `).join("");
      $("content").querySelectorAll("[data-share]").forEach((el) => {
        el.onclick = () => openShare(items[Number(el.dataset.share)], book);
      });
      $("content").querySelectorAll("[data-copy]").forEach((el) => {
        el.onclick = () => copyPlainText(noteShareText(items[Number(el.dataset.copy)], book), el);
      });
      $("content").querySelectorAll("[data-copy-quote]").forEach((el) => {
        el.onclick = () => copyPlainText(items[Number(el.dataset.copyQuote)].quote || "", el);
      });
    }

    function render() {
      applyChrome();
      const book = currentBook();
      if (!book) {
        $("content").innerHTML = `<p class="empty">${t("emptyBook")}</p>`;
        return;
      }
      state.bookId = book.id;
      renderNav(book);
      renderMain(book);
      applyScroll();
      saveView();
    }

    function wrapLines(ctx, text, maxWidth) {
      const lines = [];
      for (const para of String(text || "").split("\n")) {
        if (!para) {
          lines.push("");
          continue;
        }
        let line = "";
        for (const ch of para) {
          const next = line + ch;
          if (line && ctx.measureText(next).width > maxWidth) {
            lines.push(line);
            line = ch;
          } else {
            line = next;
          }
        }
        if (line) lines.push(line);
      }
      return lines;
    }

    function drawShareCard(item, book) {
      const dpr = 2;
      const width = 720;
      const pad = 40;
      const measure = document.createElement("canvas").getContext("2d");
      const fontQuote = '400 22px "PingFang SC", "Songti SC", serif';
      const fontNote = '400 20px "PingFang SC", "Noto Sans SC", sans-serif';
      const fontMeta = '600 13px "PingFang SC", sans-serif';
      const fontTitle = '650 18px "PingFang SC", sans-serif';
      const inner = width - pad * 2;
      measure.font = fontQuote;
      const quoteLines = item.quote ? wrapLines(measure, item.quote, inner - 36) : [];
      measure.font = fontNote;
      const noteLines = item.note ? wrapLines(measure, item.note, inner - 36) : [];
      const quoteH = quoteLines.length ? 56 + quoteLines.length * 34 : 0;
      const noteH = noteLines.length ? 56 + noteLines.length * 32 : 0;
      const height = pad + (book.author ? 106 : 86) + (quoteH ? quoteH + 16 : 0) + (noteH || 0) + pad + 12;

      const canvas = document.createElement("canvas");
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#f4efe6";
      ctx.fillRect(0, 0, width, height);
      roundRect(ctx, 24, 24, width - 48, height - 48, 18, "#fffaf2");

      let y = pad + 8;
      ctx.fillStyle = "#6d6458";
      ctx.font = fontMeta;
      ctx.fillText("APPLE BOOKS NOTES", pad, y);
      y += 32;
      ctx.fillStyle = "#1f1a14";
      ctx.font = fontTitle;
      ctx.fillText(fit(ctx, book.title || "", inner), pad, y);
      y += 22;
      if (book.author) {
        ctx.fillStyle = "#6d6458";
        ctx.font = fontMeta;
        ctx.fillText(fit(ctx, book.author, inner), pad, y);
        y += 20;
      }
      const loc = itemLocation(item);
      ctx.fillStyle = "#b4532a";
      ctx.font = fontMeta;
      ctx.fillText(fit(ctx, loc, inner), pad, y);
      y += 26;

      if (quoteLines.length) {
        roundRect(ctx, pad, y, inner, quoteH, 12, "#f7f1e6");
        ctx.fillStyle = "#6d6458";
        ctx.font = fontMeta;
        ctx.fillText(t("quote").toUpperCase(), pad + 18, y + 22);
        ctx.fillStyle = "#1f1a14";
        ctx.font = fontQuote;
        quoteLines.forEach((line, i) => ctx.fillText(line, pad + 18, y + 52 + i * 34));
        y += quoteH + 16;
      }
      if (noteLines.length) {
        roundRect(ctx, pad, y, inner, noteH, 12, "#eef6f1");
        ctx.fillStyle = "#6d6458";
        ctx.font = fontMeta;
        ctx.fillText(t("note").toUpperCase(), pad + 18, y + 22);
        ctx.fillStyle = "#1f1a14";
        ctx.font = fontNote;
        noteLines.forEach((line, i) => ctx.fillText(line, pad + 18, y + 52 + i * 32));
      }
      return canvas;
    }

    function roundRect(ctx, x, y, w, h, r, fill) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function fit(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return text;
      let out = text;
      while (out.length && ctx.measureText(`${out}…`).width > maxWidth) out = out.slice(0, -1);
      return `${out}…`;
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    }

    async function openShare(item, book) {
      if (state.shareUrl) URL.revokeObjectURL(state.shareUrl);
      const canvas = drawShareCard(item, book);
      state.shareBlob = await canvasToBlob(canvas);
      state.shareUrl = URL.createObjectURL(state.shareBlob);
      $("sharePreview").src = state.shareUrl;
      $("copyImage").textContent = t("copyImage");
      $("shareModal").classList.add("show");
    }

    function closeShare() {
      $("shareModal").classList.remove("show");
      if (state.shareUrl) {
        URL.revokeObjectURL(state.shareUrl);
        state.shareUrl = "";
      }
      if (state.pendingLoad) load({ silent: true });
    }

    async function copyShareImage() {
      if (!state.shareBlob) return;
      try {
        await navigator.clipboard.write([
          new ClipboardItem({ "image/png": Promise.resolve(state.shareBlob) }),
        ]);
        $("copyImage").textContent = t("copied");
        setTimeout(() => { $("copyImage").textContent = t("copyImage"); }, 1600);
      } catch {
        $("copyImage").textContent = t("copyFailed");
        setTimeout(() => { $("copyImage").textContent = t("copyImage"); }, 2200);
      }
    }

    function downloadShareImage() {
      if (!state.shareUrl) return;
      const a = document.createElement("a");
      a.href = state.shareUrl;
      a.download = "books-note.png";
      a.click();
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function noteShareText(item, book) {
      const loc = itemLocation(item);
      const lines = [];
      if (book.title) lines.push(book.title);
      if (book.author) lines.push(book.author);
      if (loc) lines.push(loc);
      if (lines.length) lines.push("");
      if (item.quote) {
        lines.push(t("quote"));
        lines.push(item.quote);
        lines.push("");
      }
      if (item.note) {
        lines.push(t("note"));
        lines.push(item.note);
      }
      return lines.join("\n").trim() + "\n";
    }

    async function copyPlainText(text, button) {
      const prev = button.textContent;
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = t("copied");
        flashToast(t("copied"));
        setTimeout(() => { button.textContent = prev; }, 1400);
      } catch {
        try {
          const area = document.createElement("textarea");
          area.value = text;
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
          button.textContent = t("copied");
          flashToast(t("copied"));
          setTimeout(() => { button.textContent = prev; }, 1400);
        } catch {
          button.textContent = t("copyTextFailed");
          setTimeout(() => { button.textContent = prev; }, 1800);
        }
      }
    }

    function flashToast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(flashToast._t);
      flashToast._t = setTimeout(() => el.classList.remove("show"), 1400);
    }

    function flashSynced() {
      flashToast(t("synced"));
    }

    async function load(opts = {}) {
      const silent = !!opts.silent;
      if (state.loading) {
        state.pendingLoad = true;
        return;
      }
      if (silent && $("shareModal").classList.contains("show")) {
        state.pendingLoad = true;
        return;
      }
      state.loading = true;
      state.pendingLoad = false;
      try {
        if (state.data) saveView();
        if (!silent) {
          applyChrome();
          $("content").textContent = t("loading");
        }
        const res = await fetch("/api/data", { cache: "no-store" });
        const data = await res.json();
        if (!res.ok) {
          if (!silent) {
            $("content").innerHTML = `<p class="error">${esc(t("loadError", data.error || res.status))}</p>`;
          }
          return;
        }
        state.data = data;
        restoreView(data);
        render();
        if (silent) flashSynced();
      } finally {
        state.loading = false;
        if (state.pendingLoad) {
          state.pendingLoad = false;
          load({ silent: true });
        }
      }
    }

    function onLibraryChange(rev) {
      if (state.rev == null) {
        state.rev = rev;
        return;
      }
      if (rev === state.rev) return;
      state.rev = rev;
      load({ silent: true });
    }

    function startWatch() {
      if (window.EventSource) {
        const es = new EventSource("/api/events");
        es.onmessage = (ev) => {
          try {
            onLibraryChange(JSON.parse(ev.data).rev);
          } catch {
            /* ignore malformed events */
          }
        };
        return;
      }
      setInterval(async () => {
        try {
          const res = await fetch("/api/revision", { cache: "no-store" });
          const data = await res.json();
          if (res.ok) onLibraryChange(data.rev);
        } catch {
          /* ignore poll errors */
        }
      }, 2000);
    }

    $("notesOnly").onclick = () => {
      state.notesOnly = !state.notesOnly;
      $("notesOnly").classList.toggle("on", state.notesOnly);
      state._scroll.main = 0;
      render();
    };
    $("lang").onclick = () => {
      state.lang = state.lang === "zh" ? "en" : "zh";
      localStorage.setItem("books-notes-lang", state.lang);
      render();
    };
    $("refresh").onclick = load;
    $("q").addEventListener("input", (e) => {
      state.q = e.target.value;
      state._scroll.main = 0;
      render();
    });
    let scrollTimer = 0;
    document.querySelector("main").addEventListener("scroll", () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(saveView, 120);
    });
    document.querySelector("aside").addEventListener("scroll", () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(saveView, 120);
    });
    $("copyImage").onclick = copyShareImage;
    $("downloadImage").onclick = downloadShareImage;
    $("closeShare").onclick = closeShare;
    $("shareModal").addEventListener("click", (e) => {
      if (e.target === $("shareModal")) closeShare();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $("shareModal").classList.contains("show")) closeShare();
    });
    load();
    startWatch();
  </script>
</body>
</html>
